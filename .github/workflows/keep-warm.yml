name: Keep Cloud Run warm

# DISABLED — at 1-2 users, the ~$13/mo idle cost isn't worth avoiding
# a 5-7 min cold start. Re-enable when there are paying users.
#
# To re-enable: uncomment the schedule trigger below.

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:  # manual trigger still works from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -o /dev/null -w "backend: status=%{http_code} time=%{time_total}s\n" \
            https://fxck-lectures-api-211270844056.australia-southeast1.run.app/api/health
