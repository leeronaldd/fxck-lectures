name: Keep Cloud Run warm

# Pings backend every 10 min to prevent cold starts. With cpu-throttling
# enabled, idle instances cost $0 — only billed during request processing.
# So the warm-ping effectively costs pennies/month (100ms × 144 pings/day).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -o /dev/null -w "backend: status=%{http_code} time=%{time_total}s\n" \
            https://fxck-lectures-api-211270844056.australia-southeast1.run.app/api/health
      # Whisper has L4 GPU (~$0.84/hr) — do NOT ping. Accept cold start.
